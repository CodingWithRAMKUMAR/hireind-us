<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HireIND_US</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0A0F1E; color: white; }
        .navbar {
            background: rgba(10, 14, 30, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo { display: flex; align-items: center; gap: 0.75rem; }
        .logo i { font-size: 1.5rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo span { font-size: 1.2rem; font-weight: 700; color: white; }
        .logout-btn { background: rgba(245, 101, 101, 0.2); border: 1px solid #f56565; padding: 0.5rem 1rem; border-radius: 0.5rem; color: #f56565; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(15, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
        }
        .stat-number { font-size: 2rem; font-weight: 800; color: #667eea; }
        .stat-label { color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-top: 0.25rem; }
        .card {
            background: rgba(15, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .upload-area {
            border: 2px dashed rgba(102, 126, 234, 0.5);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover { border-color: #667eea; background: rgba(102, 126, 234, 0.05); }
        .upload-area i { font-size: 2rem; color: #667eea; margin-bottom: 0.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #667eea; }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
            margin-top: 1rem;
        }
        .loading { text-align: center; padding: 2rem; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-box { margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; display: none; }
        .result-box.success { background: rgba(72, 187, 120, 0.2); border: 1px solid #48bb78; color: #48bb78; display: block; }
        .result-box.error { background: rgba(245, 101, 101, 0.2); border: 1px solid #f56565; color: #f56565; display: block; }
        @media (max-width: 768px) { .container { padding: 1rem; } table { font-size: 0.8rem; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-shield-alt"></i><span>HireIND_US | Admin Portal</span></div>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </nav>

    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-number" id="totalStudents">-</div><div class="stat-label">Total Students</div></div>
            <div class="stat-card"><div class="stat-number" id="activeStudents">-</div><div class="stat-label">Active Students</div></div>
            <div class="stat-card"><div class="stat-number" id="totalRecruiters">-</div><div class="stat-label">Total Recruiters</div></div>
            <div class="stat-card"><div class="stat-number" id="totalHires">-</div><div class="stat-label">Total Hires</div></div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-upload"></i> Bulk Upload Students (CSV)</div>
            <div class="upload-area" onclick="document.getElementById('csvFile').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Click to upload CSV file</p>
                <small style="color:rgba(255,255,255,0.5);">Format: full_name,email,city,state,university,graduation_date,visa_type</small>
                <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="uploadCSV()">
            </div>
            <div id="uploadResult" class="result-box"></div>
            <button class="btn" onclick="downloadTemplate()" style="margin-top:1rem;"><i class="fas fa-download"></i> Download CSV Template</button>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-users"></i> Recent Students</div>
            <div id="studentsList"><div class="loading"><div class="spinner"></div>Loading...</div></div>
        </div>
    </div>

    <script>
        const API_URL = '';
        
        function getToken() { return localStorage.getItem('token'); }
        
        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }
            return true;
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                if (result.success && result.stats) {
                    document.getElementById('totalStudents').innerText = result.stats.totalStudents || 0;
                    document.getElementById('activeStudents').innerText = result.stats.activeStudents || 0;
                    document.getElementById('totalRecruiters').innerText = result.stats.totalRecruiters || 0;
                    document.getElementById('totalHires').innerText = result.stats.totalHires || 0;
                }
            } catch(e) { console.error('Stats error:', e); }
        }

        async function loadStudents() {
            try {
                const response = await fetch(`${API_URL}/api/admin/students`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                if (result.success && result.students) {
                    displayStudents(result.students);
                }
            } catch(e) { console.error('Students error:', e); }
        }

        function displayStudents(students) {
            const container = document.getElementById('studentsList');
            if (!students || students.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:2rem;">No students found</p>';
                return;
            }
            
            let html = '<tr><thead>\n<th>Name</th>\n<th>Email</th>\n<th>University</th>\n<th>Visa</th>\n<th>Status</th>\n</thead>\n<tbody>';
            students.slice(0, 20).forEach(s => {
                html += `<tr>
                    <td>${escapeHtml(s.full_name || 'N/A')}</td>
                    <td>${escapeHtml(s.email || 'N/A')}</td>
                    <td>${escapeHtml(s.university_name || 'N/A')}</td>
                    <td>${s.visa_type || 'N/A'}</td>
                    <td>${s.profile_status === 'active' ? '✅ Active' : '🔴 Hired'}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function uploadCSV() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('csv', file);
            
            const resultDiv = document.getElementById('uploadResult');
            resultDiv.className = 'result-box';
            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Uploading...</div>';
            resultDiv.style.display = 'block';
            
            try {
                const response = await fetch(`${API_URL}/api/admin/bulk-upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` },
                    body: formData
                });
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.className = 'result-box success';
                    resultDiv.innerHTML = `<i class="fas fa-check-circle"></i> Upload complete!<br>
                        Total: ${result.total}<br>
                        Added: ${result.added}<br>
                        Duplicates: ${result.duplicates || 0}`;
                    loadStats();
                    loadStudents();
                } else {
                    resultDiv.className = 'result-box error';
                    resultDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${result.error || 'Upload failed'}`;
                }
            } catch(e) {
                resultDiv.className = 'result-box error';
                resultDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Network error: ${e.message}`;
            }
            
            fileInput.value = '';
        }

        function downloadTemplate() {
            const template = `full_name,email,city,state,university,graduation_date,visa_type
Raj Patel,raj@example.com,San Francisco,CA,Stanford University,2025-05-15,OPT_1st_year
Priya Sharma,priya@example.com,New York,NY,Columbia University,2025-06-01,STEM_OPT
Amit Kumar,amit@example.com,Austin,TX,University of Texas,2025-08-20,H1B`;
            
            const blob = new Blob([template], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'students_template.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        if (checkAuth()) {
            loadStats();
            loadStudents();
        }
    </script>
</body>
</html>
