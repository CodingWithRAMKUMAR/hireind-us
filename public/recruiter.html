<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireIND_US | Recruiter Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0A0F1E;
            overflow-x: hidden;
        }

        /* Navigation */
        .navbar {
            background: rgba(10, 14, 30, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo i {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo span {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a0aec0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-stats {
            display: flex;
            gap: 2rem;
        }

        .nav-stat {
            text-align: center;
        }

        .nav-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }

        .nav-stat-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
        }

        /* Main Container */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px -10px rgba(102, 126, 234, 0.3);
        }

        .stat-icon {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 1rem;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }

        /* Search Section */
        .search-section {
            background: rgba(15, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .search-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .filter-group {
            position: relative;
        }

        .filter-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 0.9rem;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 1rem;
            color: white;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 1rem;
            padding: 0.8rem 2rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(102, 126, 234, 0.4);
        }

        /* Results Section */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .results-count {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }

        .results-count span {
            color: #667eea;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
            background: rgba(255,255,255,0.05);
            padding: 0.25rem;
            border-radius: 0.75rem;
        }

        .toggle-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: #667eea;
            color: white;
        }

        /* Student Cards Grid */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
        }

        .student-card {
            background: rgba(15, 20, 40, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .student-card:hover {
            transform: translateY(-4px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .student-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.25rem;
        }

        .student-role {
            font-size: 0.8rem;
            color: #667eea;
        }

        .match-score {
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 60px;
            height: 60px;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .match-score-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: white;
        }

        .match-score-label {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.7);
        }

        .student-details {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .detail-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            background: rgba(255,255,255,0.05);
            border-radius: 2rem;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.7);
        }

        .detail-badge i {
            color: #667eea;
            font-size: 0.7rem;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .skill {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            color: #a0aec0;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .card-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .contact-btn {
            flex: 1;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 0.75rem;
            padding: 0.7rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .save-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 0.75rem;
            padding: 0.7rem 1rem;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 4rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem;
            background: rgba(15, 20, 40, 0.6);
            border-radius: 1.5rem;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .empty-state i {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state p {
            color: rgba(255,255,255,0.6);
        }

        /* Responsive */
        @media (max-width: 968px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .students-grid {
                grid-template-columns: 1fr;
            }
            
            .navbar {
                flex-direction: column;
                text-align: center;
            }
            
            .nav-stats {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-row {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-chart-line"></i>
            <span>HireIND_US</span>
        </div>
        <div class="nav-stats" id="navStats">
            <div class="nav-stat">
                <div class="nav-stat-value" id="navTotal">-</div>
                <div class="nav-stat-label">Candidates</div>
            </div>
            <div class="nav-stat">
                <div class="nav-stat-value" id="navOPT">-</div>
                <div class="nav-stat-label">OPT/STEM</div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Total Candidates</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-passport"></i></div>
                <div class="stat-number" id="optStudents">0</div>
                <div class="stat-label">On OPT/STEM</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-graduation-cap"></i></div>
                <div class="stat-number" id="activeStudents">0</div>
                <div class="stat-label">Actively Looking</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-building"></i></div>
                <div class="stat-number" id="companies">25+</div>
                <div class="stat-label">Hiring Partners</div>
            </div>
        </div>

        <div class="search-section">
            <div class="search-title">
                <i class="fas fa-search"></i>
                <span>Find Your Next Hire</span>
            </div>
            <div class="filter-row">
                <div class="filter-group">
                    <i class="fas fa-code"></i>
                    <input type="text" id="skillSearch" placeholder="Skills (Python, AWS, React...)">
                </div>
                <div class="filter-group">
                    <i class="fas fa-map-marker-alt"></i>
                    <select id="stateFilter">
                        <option value="">All States</option>
                        <option value="CA">California</option>
                        <option value="TX">Texas</option>
                        <option value="NY">New York</option>
                        <option value="MA">Massachusetts</option>
                        <option value="WA">Washington</option>
                        <option value="IL">Illinois</option>
                        <option value="GA">Georgia</option>
                        <option value="NC">North Carolina</option>
                        <option value="VA">Virginia</option>
                        <option value="FL">Florida</option>
                    </select>
                </div>
                <div class="filter-group">
                    <i class="fas fa-passport"></i>
                    <select id="visaFilter">
                        <option value="">All Visas</option>
                        <option value="OPT_1st_year">OPT (1st Year)</option>
                        <option value="OPT_2nd_year">OPT (2nd Year)</option>
                        <option value="STEM_OPT">STEM OPT</option>
                        <option value="H1B">H1B</option>
                    </select>
                </div>
                <div class="filter-group">
                    <i class="fas fa-university"></i>
                    <input type="text" id="universityFilter" placeholder="University name">
                </div>
            </div>
            <button class="search-btn" onclick="searchStudents()">
                <i class="fas fa-search"></i> Search Candidates
            </button>
        </div>

        <div class="results-header">
            <div class="results-count">
                <span id="resultCount">0</span> candidates found
            </div>
            <div class="view-toggle">
                <button class="toggle-btn active" onclick="setView('grid')"><i class="fas fa-th"></i></button>
                <button class="toggle-btn" onclick="setView('list')"><i class="fas fa-list"></i></button>
            </div>
        </div>

        <div id="results" class="students-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading candidates...</p>
            </div>
        </div>
    </div>

    <script>
        let allStudents = [];
        let currentView = 'grid';

        async function loadStats() {
            try {
                const response = await fetch('/api/recruiter/stats');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('totalStudents').innerText = data.totalStudents || 0;
                    document.getElementById('optStudents').innerText = data.optStudents || 0;
                    document.getElementById('activeStudents').innerText = data.totalStudents || 0;
                    document.getElementById('navTotal').innerText = data.totalStudents || 0;
                    document.getElementById('navOPT').innerText = data.optStudents || 0;
                }
            } catch(e) {
                console.error('Stats error:', e);
            }
        }

        async function searchStudents() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Searching...</p></div>';
            
            const state = document.getElementById('stateFilter').value;
            const visa = document.getElementById('visaFilter').value;
            const university = document.getElementById('universityFilter').value;
            
            let url = '/api/students?';
            if (state) url += `state=${state}&`;
            if (visa) url += `visa=${visa}&`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success && data.students) {
                    allStudents = data.students;
                    document.getElementById('resultCount').innerText = allStudents.length;
                    displayStudents(allStudents);
                } else {
                    resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-user-graduate"></i><p>No candidates found. Try adjusting your filters.</p></div>';
                }
            } catch(e) {
                resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading candidates. Please try again.</p></div>';
            }
        }

        function displayStudents(students) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.className = currentView === 'grid' ? 'students-grid' : 'students-list';
            
            if (students.length === 0) {
                resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-user-graduate"></i><p>No candidates found</p></div>';
                return;
            }
            
            let html = '';
            students.forEach(student => {
                const matchScore = Math.floor(Math.random() * 30) + 70;
                html += `
                    <div class="student-card">
                        <div class="card-header">
                            <div>
                                <div class="student-name">${escapeHtml(student.full_name || 'Student')}</div>
                                <div class="student-role">${student.university_name || 'University'}</div>
                            </div>
                            <div class="match-score">
                                <div class="match-score-value">${matchScore}%</div>
                                <div class="match-score-label">Match</div>
                            </div>
                        </div>
                        <div class="student-details">
                            <span class="detail-badge"><i class="fas fa-map-marker-alt"></i> ${student.current_city || 'N/A'}, ${student.current_state || 'N/A'}</span>
                            <span class="detail-badge"><i class="fas fa-passport"></i> ${formatVisa(student.visa_type)}</span>
                            <span class="detail-badge"><i class="fas fa-calendar"></i> ${student.graduation_date || 'N/A'}</span>
                        </div>
                        <div id="skills-${student.id}" class="skills-container">
                            <span class="detail-badge">Loading skills...</span>
                        </div>
                        <div class="card-actions">
                            <button class="contact-btn" onclick="contactStudent('${student.id}', '${escapeHtml(student.full_name)}')">
                                <i class="fas fa-envelope"></i> Contact
                            </button>
                            <button class="save-btn" onclick="saveStudent('${student.id}')">
                                <i class="fas fa-bookmark"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
            
            students.forEach(student => {
                loadStudentSkills(student.id);
            });
        }

        async function loadStudentSkills(studentId) {
            try {
                const response = await fetch(`/api/students/${studentId}`);
                const data = await response.json();
                if (data.success && data.student && data.student.student_skills) {
                    const skillsDiv = document.getElementById(`skills-${studentId}`);
                    let skillsHtml = '';
                    data.student.student_skills.forEach(ss => {
                        if (ss.skills) {
                            skillsHtml += `<span class="skill">${ss.skills.skill_name}</span>`;
                        }
                    });
                    skillsDiv.innerHTML = skillsHtml || '<span class="detail-badge">No skills listed</span>';
                }
            } catch(e) {
                console.error('Skills error:', e);
            }
        }

        function formatVisa(visa) {
            const map = {
                'OPT_1st_year': 'OPT (1st Year)',
                'OPT_2nd_year': 'OPT (2nd Year)',
                'STEM_OPT': 'STEM OPT',
                'H1B': 'H1B',
                'Green_Card': 'Green Card',
                'Citizen': 'US Citizen'
            };
            return map[visa] || visa || 'N/A';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function contactStudent(studentId, studentName) {
            alert(`📧 Contact ${studentName}\n\nStudent ID: ${studentId}\n\nTo enable email:\n1. Configure SMTP in .env\n2. Add your SendGrid/Gmail credentials\n\nFor now, you can reach out via LinkedIn.`);
        }

        function saveStudent(studentId) {
            alert(`Student ${studentId} saved to shortlist!`);
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if (allStudents.length > 0) displayStudents(allStudents);
        }

        // Auto-refresh every 30 seconds
        loadStats();
        searchStudents();
        setInterval(() => {
            loadStats();
            searchStudents();
        }, 30000);
    </script>
</body>
</html>
