<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireIND_US - Indian Students in USA Job Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-bottom: 10px; color: #333; }
        .subtitle { text-align: center; margin-bottom: 30px; color: #666; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { transform: translateY(-2px); }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        .nav-links { text-align: center; margin-top: 20px; }
        .nav-links a { color: white; margin: 0 15px; text-decoration: none; font-weight: 500; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🇮🇳 HireIND_US</h1>
            <div class="subtitle">Indian students in USA — Get discovered by top IT recruiters</div>
            
            <form id="studentForm" enctype="multipart/form-data">
                <div class="row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" name="full_name" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" name="phone">
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>Current City *</label>
                        <input type="text" name="current_city" placeholder="e.g., San Francisco" required>
                    </div>
                    <div class="form-group">
                        <label>State *</label>
                        <select name="current_state" required>
                            <option value="">Select State</option>
                            <option>CA</option><option>TX</option><option>NY</option><option>MA</option>
                            <option>WA</option><option>IL</option><option>GA</option><option>NC</option>
                            <option>VA</option><option>FL</option><option>OH</option><option>PA</option>
                            <option>MI</option><option>NJ</option><option>CO</option><option>AZ</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>University *</label>
                    <input type="text" name="university_name" required>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>Graduation Date</label>
                        <input type="month" name="graduation_date">
                    </div>
                    <div class="form-group">
                        <label>Visa Status *</label>
                        <select name="visa_type" required>
                            <option value="">Select Visa</option>
                            <option value="OPT_1st_year">OPT (1st year)</option>
                            <option value="OPT_2nd_year">OPT (2nd year)</option>
                            <option value="STEM_OPT">STEM OPT Extension</option>
                            <option value="H1B">H1B Visa</option>
                            <option value="Green_Card">Green Card</option>
                            <option value="Citizen">US Citizen</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Skills (comma separated) *</label>
                    <input type="text" name="skills" placeholder="e.g., Python, AWS, React, Java" required>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>LinkedIn URL</label>
                        <input type="url" name="linkedin_url" placeholder="https://linkedin.com/in/username">
                    </div>
                    <div class="form-group">
                        <label>GitHub URL</label>
                        <input type="url" name="github_url" placeholder="https://github.com/username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Upload Resume (PDF) *</label>
                    <input type="file" name="resume" accept=".pdf,.docx" required>
                </div>
                
                <button type="submit">Register Now</button>
            </form>
            
            <div id="message" class="message"></div>
        </div>
        
        <div class="nav-links">
            <a href="recruiter.html">🔍 Recruiter Dashboard</a>
            <a href="#" onclick="showInfo()">ℹ️ How it works</a>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('studentForm');
        const messageDiv = document.getElementById('message');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            messageDiv.className = 'message';
            messageDiv.innerHTML = 'Submitting...';
            messageDiv.style.display = 'block';
            
            try {
                const response = await fetch('/api/students/register', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = '✅ Registration successful! Recruiters can now find you.';
                    form.reset();
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.innerHTML = '❌ Error: ' + (result.error || 'Registration failed');
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ Network error. Make sure the server is running.';
            }
        });
        
        function showInfo() {
            alert('HireIND_US connects Indian students in USA with IT recruiters.\n\nYour profile will be visible to verified recruiters only.');
        }
    </script>
</body>
</html>
