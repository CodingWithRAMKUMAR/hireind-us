<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard - HireIND_US</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0A0F1E; color: white; }
        .navbar {
            background: rgba(10, 14, 30, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo { display: flex; align-items: center; gap: 0.75rem; }
        .logo i { font-size: 1.5rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo span { font-size: 1.2rem; font-weight: 700; color: white; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .nav-link { color: rgba(255,255,255,0.7); text-decoration: none; transition: color 0.2s; font-size: 0.9rem; }
        .nav-link:hover { color: #667eea; }
        .credits-badge { background: linear-gradient(135deg, #667eea, #764ba2); padding: 0.5rem 1rem; border-radius: 2rem; font-size: 0.85rem; }
        .logout-btn { background: rgba(245, 101, 101, 0.2); border: 1px solid #f56565; padding: 0.5rem 1rem; border-radius: 0.5rem; color: #f56565; cursor: pointer; }
        .badge { background: #f56565; color: white; border-radius: 50%; padding: 2px 8px; font-size: 11px; margin-left: 5px; display: inline-block; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: rgba(15, 20, 40, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(102, 126, 234, 0.2); border-radius: 1rem; padding: 1.5rem; text-align: center; }
        .stat-number { font-size: 2rem; font-weight: 800; color: #667eea; }
        .search-section { background: rgba(15, 20, 40, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(102, 126, 234, 0.2); border-radius: 1rem; padding: 1.5rem; margin-bottom: 2rem; }
        .filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .filter-group { margin-bottom: 0.5rem; }
        .filter-group label { display: block; margin-bottom: 0.25rem; font-size: 0.7rem; color: rgba(255,255,255,0.5); }
        select, input { width: 100%; padding: 0.75rem; background-color: #1a1f3a; border: 1px solid rgba(102, 126, 234, 0.3); border-radius: 0.5rem; color: white; font-size: 0.9rem; }
        select option { background-color: #0A0F1E; color: white; }
        .search-btn { background: linear-gradient(135deg, #667eea, #764ba2); border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; color: white; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
        .reset-btn { background: #4a5568; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; color: white; font-weight: 600; cursor: pointer; margin-top: 0.5rem; margin-left: 0.5rem; }
        .advanced-toggle { color: #667eea; cursor: pointer; font-size: 0.85rem; margin-top: 0.5rem; display: inline-block; }
        .advanced-filters { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(102, 126, 234, 0.3); }
        .advanced-filters.show { display: block; }
        .students-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1.5rem; }
        .student-card { background: rgba(15, 20, 40, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(102, 126, 234, 0.2); border-radius: 1rem; padding: 1.5rem; transition: all 0.2s; }
        .student-card:hover { transform: translateY(-4px); border-color: #667eea; }
        .student-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; }
        .student-title { font-size: 0.8rem; color: #667eea; margin-bottom: 0.5rem; }
        .student-details { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
        .detail-badge { background: rgba(255,255,255,0.05); padding: 0.25rem 0.75rem; border-radius: 2rem; font-size: 0.7rem; display: inline-flex; align-items: center; gap: 0.25rem; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 2rem; font-size: 0.7rem; display: inline-block; }
        .status-active { background: #48bb78; color: white; }
        .status-open { background: #ed8936; color: white; }
        .status-not { background: #a0aec0; color: white; }
        .card-actions { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
        .view-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 0.6rem; border-radius: 0.5rem; color: white; cursor: pointer; }
        .contact-btn { flex: 1; background: linear-gradient(135deg, #667eea, #764ba2); border: none; padding: 0.6rem; border-radius: 0.5rem; color: white; font-weight: 600; cursor: pointer; }
        .contact-btn.disabled { opacity: 0.5; cursor: not-allowed; background: #4a5568; }
        .hire-btn { background: rgba(72, 187, 120, 0.2); border: 1px solid #48bb78; padding: 0.6rem 1rem; border-radius: 0.5rem; color: #48bb78; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1f3a; border-radius: 1rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 2rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(102, 126, 234, 0.3); }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: white; cursor: pointer; }
        textarea { width: 100%; padding: 0.75rem; background: #0A0F1E; border: 1px solid #667eea; border-radius: 0.5rem; color: white; margin: 1rem 0; font-family: inherit; }
        .resume-list { margin-top: 1rem; }
        .resume-item { background: rgba(255,255,255,0.05); padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .download-resume-btn { background: #48bb78; border: none; padding: 0.25rem 0.75rem; border-radius: 0.25rem; color: white; cursor: pointer; font-size: 0.75rem; }
        .loading { text-align: center; padding: 2rem; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(102, 126, 234, 0.2); border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) { .container { padding: 1rem; } .students-grid { grid-template-columns: 1fr; } .nav-links { justify-content: center; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-briefcase"></i><span>HireIND_US | Recruiter Portal</span></div>
        <div class="nav-links">
            <a href="recruiter-dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="recruiter-inbox.html" class="nav-link"><i class="fas fa-envelope"></i> Inbox <span id="inboxBadge" class="badge" style="display: none;">0</span></a>
            <div class="credits-badge"><i class="fas fa-coins"></i> <span id="creditsRemaining">-</span> Credits</div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalCandidates">-</div><div>Available Candidates</div></div>
            <div class="stat-card"><div class="stat-number" id="optCandidates">-</div><div>On OPT/STEM</div></div>
            <div class="stat-card"><div class="stat-number" id="myCredits">-</div><div>My Credits</div></div>
            <div class="stat-card"><div class="stat-number" id="myHires">-</div><div>My Hires</div></div>
        </div>

        <div class="search-section">
            <h3 style="margin-bottom: 1rem;"><i class="fas fa-search"></i> Find Candidates</h3>
            
            <!-- Basic Filters -->
            <div class="filter-row">
                <div class="filter-group">
                    <label><i class="fas fa-code"></i> Skills / Job Title</label>
                    <input type="text" id="skillSearch" placeholder="Python, Java, React, Data Analyst...">
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-map-marker-alt"></i> State</label>
                    <select id="stateFilter">
                        <option value="">All States</option>
                        <option value="CA">California</option><option value="TX">Texas</option>
                        <option value="NY">New York</option><option value="MA">Massachusetts</option>
                        <option value="WA">Washington</option><option value="IL">Illinois</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-passport"></i> Visa Status</label>
                    <select id="visaFilter">
                        <option value="">All Visas</option>
                        <option value="OPT_1st_year">OPT (1st Year)</option>
                        <option value="OPT_2nd_year">OPT (2nd Year)</option>
                        <option value="STEM_OPT">STEM OPT</option>
                        <option value="H1B">H1B</option>
                    </select>
                </div>
            </div>

            <!-- Advanced Filters Toggle -->
            <div class="advanced-toggle" onclick="toggleAdvancedFilters()">
                <i class="fas fa-sliders-h"></i> Advanced Filters <i class="fas fa-chevron-down"></i>
            </div>

            <!-- Advanced Filters -->
            <div id="advancedFilters" class="advanced-filters">
                <div class="filter-row">
                    <div class="filter-group">
                        <label><i class="fas fa-briefcase"></i> Preferred Job Title</label>
                        <input type="text" id="preferredJobTitleFilter" placeholder="e.g., Data Analyst, Java Developer">
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-building"></i> Current Company</label>
                        <input type="text" id="currentCompanyFilter" placeholder="Company name">
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-chart-line"></i> Job Search Status</label>
                        <select id="jobStatusFilter">
                            <option value="">All Status</option>
                            <option value="actively_looking">Actively Looking</option>
                            <option value="open_to_offers">Open to Offers</option>
                            <option value="not_looking">Not Looking</option>
                        </select>
                    </div>
                </div>
                <div class="filter-row">
                    <div class="filter-group">
                        <label><i class="fas fa-calendar-alt"></i> Graduation Year</label>
                        <select id="graduationYearFilter">
                            <option value="">Any Year</option>
                            <option value="2023">2023</option><option value="2024">2024</option>
                            <option value="2025">2025</option><option value="2026">2026</option>
                            <option value="2027">2027</option><option value="2028">2028</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-chart-line"></i> Experience Range (Years)</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="number" step="0.5" id="expMinFilter" placeholder="Min" style="width: 50%;">
                            <input type="number" step="0.5" id="expMaxFilter" placeholder="Max" style="width: 50%;">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-clock"></i> Experience Gap</label>
                        <select id="expGapFilter">
                            <option value="">Any</option>
                            <option value="None">No Gap</option>
                            <option value="Less than 6 months">Less than 6 months</option>
                            <option value="6 months">6 months</option>
                            <option value="1 year">1 year</option>
                            <option value="More than 1 year">More than 1 year</option>
                        </select>
                    </div>
                </div>
            </div>

            <div>
                <button class="search-btn" onclick="searchCandidates()"><i class="fas fa-search"></i> Search Candidates</button>
                <button class="reset-btn" onclick="resetFilters()"><i class="fas fa-undo-alt"></i> Reset Filters</button>
            </div>
        </div>

        <div id="results" class="students-grid"><div class="loading"><div class="spinner"></div><p>Loading candidates...</p></div></div>
    </div>

    <!-- Contact Modal -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Contact Candidate</h3><button class="modal-close" onclick="closeContactModal()">&times;</button></div>
            <p>This will cost <strong>1 credit</strong>. Your remaining credits: <strong id="modalCredits">-</strong></p>
            <input type="text" id="contactSubject" placeholder="Subject (Optional)" style="width:100%; padding:0.75rem; background:#0A0F1E; border:1px solid #667eea; border-radius:0.5rem; color:white; margin-bottom:1rem;">
            <textarea id="contactMessage" rows="4" placeholder="Write your message to the candidate..."></textarea>
            <button class="search-btn" style="width:100%;" onclick="sendContact()">Send Message (1 Credit)</button>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header"><h3>Candidate Profile</h3><button class="modal-close" onclick="closeProfileModal()">&times;</button></div>
            <div id="profileModalContent"><div class="loading"><div class="spinner"></div><p>Loading profile...</p></div></div>
        </div>
    </div>

    <script>
        const API_URL = '';
        let selectedStudentId = null;
        let recruiterData = null;

        function getToken() { return localStorage.getItem('token'); }
        function checkAuth() { if (!getToken()) { window.location.href = '/login.html'; return false; } return true; }

        function toggleAdvancedFilters() {
            document.getElementById('advancedFilters').classList.toggle('show');
        }

        function resetFilters() {
            document.getElementById('skillSearch').value = '';
            document.getElementById('stateFilter').value = '';
            document.getElementById('visaFilter').value = '';
            document.getElementById('preferredJobTitleFilter').value = '';
            document.getElementById('currentCompanyFilter').value = '';
            document.getElementById('jobStatusFilter').value = '';
            document.getElementById('graduationYearFilter').value = '';
            document.getElementById('expMinFilter').value = '';
            document.getElementById('expMaxFilter').value = '';
            document.getElementById('expGapFilter').value = '';
            searchCandidates();
        }

        async function loadUnreadCount() {
            try {
                const response = await fetch(`${API_URL}/api/recruiter/unread-count?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                const badge = document.getElementById('inboxBadge');
                if (result.success && result.count > 0) {
                    badge.innerText = result.count;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch(e) { console.error('Unread count error:', e); }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/recruiter/stats?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` },
                    cache: 'no-cache'
                });
                const result = await response.json();
                if (result.success) {
                    const credits = result.recruiter?.credits || 0;
                    document.getElementById('totalCandidates').innerText = result.totalStudents || 0;
                    document.getElementById('optCandidates').innerText = result.optStudents || 0;
                    document.getElementById('creditsRemaining').innerText = credits;
                    document.getElementById('myCredits').innerText = credits;
                    document.getElementById('myHires').innerText = result.recruiter?.total_hires || 0;
                    if (recruiterData) recruiterData.credits = credits;
                }
            } catch(e) { console.error('Stats error:', e); }
        }

        async function searchCandidates() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Searching...</p></div>';
            
            const body = {
                skill: document.getElementById('skillSearch').value,
                state: document.getElementById('stateFilter').value,
                visa: document.getElementById('visaFilter').value,
                preferred_job_title: document.getElementById('preferredJobTitleFilter').value,
                current_company: document.getElementById('currentCompanyFilter').value,
                job_search_status: document.getElementById('jobStatusFilter').value,
                graduation_year: document.getElementById('graduationYearFilter').value,
                exp_min: document.getElementById('expMinFilter').value,
                exp_max: document.getElementById('expMaxFilter').value,
                experience_gap: document.getElementById('expGapFilter').value
            };
            
            try {
                const response = await fetch(`${API_URL}/api/recruiter/search?t=${Date.now()}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const result = await response.json();
                if (result.success && result.students) { displayStudents(result.students); }
                else { resultsDiv.innerHTML = '<p style="text-align:center; padding:2rem;">No candidates found</p>'; }
                await loadStats();
            } catch(e) { resultsDiv.innerHTML = '<p style="text-align:center; padding:2rem; color:#f56565;">Error loading candidates</p>'; }
        }

        function getJobStatusClass(status) {
            const map = { 'actively_looking': 'status-active', 'open_to_offers': 'status-open', 'not_looking': 'status-not' };
            return map[status] || 'status-not';
        }

        function getJobStatusText(status) {
            const map = { 'actively_looking': '🔥 Actively Looking', 'open_to_offers': '📋 Open to Offers', 'not_looking': '💤 Not Looking' };
            return map[status] || status || 'Not specified';
        }

        function displayStudents(students) {
            const resultsDiv = document.getElementById('results');
            if (students.length === 0) { resultsDiv.innerHTML = '<p style="text-align:center; padding:2rem;">No candidates found</p>'; return; }
            let html = '';
            const currentCredits = parseInt(document.getElementById('creditsRemaining').innerText) || 0;
            students.forEach(s => {
                const statusClass = getJobStatusClass(s.job_search_status);
                const statusText = getJobStatusText(s.job_search_status);
                html += `<div class="student-card">
                    <div class="student-name">${escapeHtml(s.full_name || 'Student')}</div>
                    ${s.preferred_job_title ? `<div class="student-title"><i class="fas fa-briefcase"></i> ${escapeHtml(s.preferred_job_title)}</div>` : ''}
                    <div class="student-details">
                        <span class="detail-badge"><i class="fas fa-map-marker-alt"></i> ${s.current_city || 'N/A'}, ${s.current_state || 'N/A'}</span>
                        <span class="detail-badge"><i class="fas fa-passport"></i> ${formatVisa(s.visa_type)}</span>
                        <span class="detail-badge"><i class="fas fa-calendar"></i> Grad: ${s.graduation_year || (s.graduation_date ? s.graduation_date.slice(0,4) : 'N/A')}</span>
                        <span class="detail-badge"><i class="fas fa-chart-line"></i> Exp: ${s.experience_range_min || '0'}-${s.experience_range_max || '0'} yrs</span>
                        <span class="detail-badge"><i class="fas fa-eye"></i> ${s.profile_view_count || 0} views</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="student-details">
                        ${s.current_company ? `<span class="detail-badge"><i class="fas fa-building"></i> ${escapeHtml(s.current_company)}</span>` : ''}
                        ${s.experience_gap && s.experience_gap !== 'None' ? `<span class="detail-badge"><i class="fas fa-clock"></i> Gap: ${escapeHtml(s.experience_gap)}</span>` : ''}
                    </div>
                    <div class="card-actions">
                        <button class="view-btn" onclick="viewFullProfile('${s.id}')"><i class="fas fa-eye"></i> View Profile</button>
                        <button class="contact-btn" onclick="openContactModal('${s.id}')" ${currentCredits <= 0 ? 'disabled' : ''}><i class="fas fa-envelope"></i> Contact</button>
                        <button class="hire-btn" onclick="markAsHired('${s.id}')"><i class="fas fa-check"></i> Hire</button>
                    </div>
                </div>`;
            });
            resultsDiv.innerHTML = html;
        }

        async function viewFullProfile(studentId) {
            const modal = document.getElementById('profileModal');
            const content = document.getElementById('profileModalContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading profile...</p></div>';
            modal.classList.add('active');
            try {
                const response = await fetch(`${API_URL}/api/recruiter/student/${studentId}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                if (result.success) {
                    const s = result.student;
                    let resumesHtml = '';
                    if (s.resumes && s.resumes.length > 0) {
                        resumesHtml = '<div class="resume-list"><strong>Resumes:</strong><div>';
                        s.resumes.forEach(resume => {
                            resumesHtml += `<div class="resume-item"><span>📄 ${escapeHtml(resume.file_name || 'Resume')}</span><span>${new Date(resume.uploaded_at).toLocaleDateString()}</span><button class="download-resume-btn" onclick="downloadResume('${resume.id}')">Download</button></div>`;
                        });
                        resumesHtml += '</div></div>';
                    }
                    content.innerHTML = `<h4>${escapeHtml(s.full_name)}</h4><p style="color:#667eea;">${s.university_name || 'University'}</p>
                        <div class="student-details" style="flex-direction:column; margin:1rem 0;">
                            <span><i class="fas fa-briefcase"></i> Preferred: ${escapeHtml(s.preferred_job_title) || 'Not specified'}</span>
                            <span><i class="fas fa-building"></i> Current Company: ${escapeHtml(s.current_company) || 'Not specified'}</span>
                            <span><i class="fas fa-chart-line"></i> Job Status: ${getJobStatusText(s.job_search_status)}</span>
                            <span><i class="fas fa-clock"></i> Experience Gap: ${s.experience_gap || 'None'}</span>
                            <span><i class="fas fa-chart-line"></i> Experience: ${s.experience_range_min || '0'}-${s.experience_range_max || '0'} years</span>
                            <span>📍 ${s.current_city || 'N/A'}, ${s.current_state || 'N/A'}</span>
                            <span>🪪 ${formatVisa(s.visa_type)}</span>
                            <span>📅 Graduation: ${s.graduation_date || 'N/A'} (Year: ${s.graduation_year || 'N/A'})</span>
                            <span>📧 ${s.email || 'Not provided'}</span>
                            <span>📞 ${s.phone || 'Not provided'}</span>
                            ${s.linkedin_url ? `<span><i class="fab fa-linkedin"></i> <a href="${s.linkedin_url}" target="_blank" style="color:#667eea;">LinkedIn</a></span>` : ''}
                            ${s.github_url ? `<span><i class="fab fa-github"></i> <a href="${s.github_url}" target="_blank" style="color:#667eea;">GitHub</a></span>` : ''}
                        </div>
                        <div><strong>Skills:</strong> ${s.skills?.join(', ') || 'None listed'}</div>${resumesHtml}
                        <div class="card-actions" style="margin-top:1.5rem;">
                            <button class="contact-btn" onclick="closeProfileModal(); openContactModal('${studentId}')">Contact (1 Credit)</button>
                            <button class="hire-btn" onclick="closeProfileModal(); markAsHired('${studentId}')">Mark as Hired</button>
                        </div>`;
                }
            } catch(e) { content.innerHTML = '<p>Error loading profile</p>'; }
        }

        async function downloadResume(resumeId) {
            try {
                const response = await fetch(`${API_URL}/api/download-resume/${resumeId}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                if (result.success) { window.open(result.download_url, '_blank'); }
                else { alert('❌ ' + (result.error || 'Cannot download')); }
            } catch(e) { alert('Network error'); }
        }

        async function openContactModal(studentId) {
            const credits = parseInt(document.getElementById('creditsRemaining').innerText) || 0;
            if (credits <= 0) { alert('No credits remaining!'); return; }
            selectedStudentId = studentId;
            document.getElementById('modalCredits').innerText = credits;
            document.getElementById('contactMessage').value = '';
            document.getElementById('contactModal').classList.add('active');
        }

        function closeContactModal() { document.getElementById('contactModal').classList.remove('active'); }
        function closeProfileModal() { document.getElementById('profileModal').classList.remove('active'); }

        async function sendContact() {
            const message = document.getElementById('contactMessage').value;
            if (!message) { alert('Please enter a message'); return; }
            const sendBtn = document.querySelector('#contactModal .search-btn');
            const originalText = sendBtn.innerHTML;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            sendBtn.disabled = true;
            try {
                const response = await fetch(`${API_URL}/api/recruiter/contact`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: selectedStudentId, message: message })
                });
                const result = await response.json();
                if (result.success) {
                    const newCredits = result.credits_remaining;
                    document.getElementById('creditsRemaining').innerText = newCredits;
                    document.getElementById('myCredits').innerText = newCredits;
                    alert('✅ ' + result.message);
                    closeContactModal();
                    searchCandidates();
                } else { alert('❌ Error: ' + (result.error || 'Failed')); }
            } catch(e) { alert('Network error'); }
            finally { sendBtn.innerHTML = originalText; sendBtn.disabled = false; }
        }

        async function markAsHired(studentId) {
            if (!confirm('Mark as hired?')) return;
            try {
                const response = await fetch(`${API_URL}/api/recruiter/mark-hired`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: studentId })
                });
                const result = await response.json();
                if (result.success) { alert('✅ Hired!'); searchCandidates(); loadStats(); }
                else { alert('❌ ' + (result.error || 'Failed')); }
            } catch(e) { alert('Network error'); }
        }

        function formatVisa(visa) {
            const map = { 'OPT_1st_year': 'OPT (1st Year)', 'OPT_2nd_year': 'OPT (2nd Year)', 'STEM_OPT': 'STEM OPT', 'H1B': 'H1B' };
            return map[visa] || visa || 'N/A';
        }

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/login.html'; }

        if (checkAuth()) { loadStats(); searchCandidates(); loadUnreadCount(); }
        setInterval(() => { if (checkAuth()) { loadUnreadCount(); loadStats(); } }, 30000);
    </script>
</body>
</html>
