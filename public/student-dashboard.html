<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - HireIND_US</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0A0F1E; color: white; }
        .navbar {
            background: rgba(10, 14, 30, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo { display: flex; align-items: center; gap: 0.75rem; }
        .logo i { font-size: 1.5rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo span { font-size: 1.2rem; font-weight: 700; color: white; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .nav-link { color: rgba(255,255,255,0.7); text-decoration: none; transition: color 0.2s; }
        .nav-link:hover { color: #667eea; }
        .logout-btn { background: rgba(245, 101, 101, 0.2); border: 1px solid #f56565; padding: 0.5rem 1rem; border-radius: 0.5rem; color: #f56565; cursor: pointer; }
        .notification-bell { position: relative; cursor: pointer; font-size: 1.2rem; color: rgba(255,255,255,0.7); }
        .notification-bell:hover { color: #667eea; }
        .notification-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #f56565;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .welcome-section {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15), rgba(118, 75, 162, 0.15));
            border-radius: 1.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .welcome-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: rgba(15, 20, 40, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(102, 126, 234, 0.2); border-radius: 1rem; padding: 1.5rem; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 800; color: #667eea; }
        .profile-card, .resumes-card {
            background: rgba(15, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .section-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .profile-field { margin-bottom: 1rem; }
        .profile-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-bottom: 0.25rem; }
        .profile-value { font-size: 0.95rem; color: white; word-break: break-word; }
        .skills-container { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .skill-tag { background: linear-gradient(135deg, #667eea, #764ba2); padding: 0.25rem 0.75rem; border-radius: 2rem; font-size: 0.75rem; }
        .edit-btn, .upload-resume-btn { background: linear-gradient(135deg, #667eea, #764ba2); border: none; padding: 0.5rem 1.5rem; border-radius: 0.5rem; color: white; font-weight: 600; cursor: pointer; margin-right: 0.5rem; }
        .resume-item {
            background: rgba(255,255,255,0.05);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .resume-link { color: #667eea; text-decoration: none; }
        .resume-link:hover { text-decoration: underline; }
        .delete-resume-btn { background: #f56565; border: none; padding: 0.25rem 0.75rem; border-radius: 0.25rem; color: white; cursor: pointer; font-size: 0.75rem; }
        .delete-resume-btn:hover { background: #e53e3e; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1f3a;
            border-radius: 1rem;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2rem;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(102, 126, 234, 0.3); }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: white; cursor: pointer; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: #0A0F1E;
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 0.5rem;
            color: white;
        }
        .form-group select option { background: #0A0F1E; color: white; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .save-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
        .loading { text-align: center; padding: 2rem; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .notifications-dropdown {
            position: absolute;
            top: 60px;
            right: 20px;
            width: 350px;
            background: #1a1f3a;
            border-radius: 1rem;
            border: 1px solid rgba(102, 126, 234, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
            max-height: 400px;
            overflow-y: auto;
        }
        .notifications-dropdown.show { display: block; }
        .notification-item { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .notification-item:hover { background: rgba(102, 126, 234, 0.1); }
        .notification-item.unread { background: rgba(102, 126, 234, 0.15); border-left: 3px solid #667eea; }
        .notification-title { font-weight: 600; font-size: 0.85rem; }
        .notification-message { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-top: 0.25rem; }
        .notification-time { font-size: 0.65rem; color: rgba(255,255,255,0.4); margin-top: 0.25rem; }
        @media (max-width: 768px) { .container { padding: 1rem; } .profile-grid { grid-template-columns: 1fr; } .notifications-dropdown { width: 90%; right: 5%; left: 5%; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-user-graduate"></i><span>HireIND_US | Student Portal</span></div>
        <div class="nav-links">
            <a href="student-dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="student-inbox.html" class="nav-link"><i class="fas fa-envelope"></i> Inbox</a>
            <div class="notification-bell" onclick="toggleNotifications()">
                <i class="fas fa-bell"></i>
                <span id="notificationCount" class="notification-count" style="display: none;">0</span>
            </div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div id="notificationsDropdown" class="notifications-dropdown">
        <div id="notificationsList"></div>
    </div>

    <div class="container">
        <div class="welcome-section">
            <h1 class="welcome-title" id="welcomeName">Welcome, Student!</h1>
            <p>Complete your profile to get discovered by top recruiters.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="profileViews">-</div><div>Profile Views</div></div>
            <div class="stat-card"><div class="stat-value" id="profileStatus">-</div><div>Profile Status</div></div>
            <div class="stat-card"><div class="stat-value" id="unreadMessages">-</div><div>Unread Messages</div></div>
        </div>

        <div class="profile-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                <div class="section-title"><i class="fas fa-id-card"></i><span>My Profile</span></div>
                <div>
                    <button class="upload-resume-btn" onclick="openResumeUploadModal()"><i class="fas fa-upload"></i> Upload Resume</button>
                    <button class="edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i> Edit Profile</button>
                </div>
            </div>
            <div id="profileContent"><div class="loading"><div class="spinner"></div><p>Loading profile...</p></div></div>
        </div>

        <div class="resumes-card" id="resumesCard" style="display: none;">
            <div class="section-title"><i class="fas fa-file-alt"></i><span>My Resumes</span></div>
            <div id="resumesList"></div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Edit Profile</h3><button class="modal-close" onclick="closeEditModal()">&times;</button></div>
            <form id="editProfileForm" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-group"><label>Full Name</label><input type="text" name="full_name" id="editFullName"></div>
                    <div class="form-group"><label>Phone</label><input type="tel" name="phone" id="editPhone"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Current City</label><input type="text" name="current_city" id="editCity"></div>
                    <div class="form-group"><label>State</label>
                        <select name="current_state" id="editState">
                            <option value="">Select State</option>
                            <option value="CA">California</option>
                            <option value="TX">Texas</option>
                            <option value="NY">New York</option>
                            <option value="MA">Massachusetts</option>
                            <option value="WA">Washington</option>
                            <option value="IL">Illinois</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>University</label><input type="text" name="university_name" id="editUniversity"></div>
                <div class="form-row">
                    <div class="form-group"><label>Graduation Date</label><input type="date" name="graduation_date" id="editGraduation"></div>
                    <div class="form-group"><label>Graduation Year</label>
                        <select name="graduation_year" id="editGraduationYear">
                            <option value="">Select Year</option>
                            <option value="2023">2023</option><option value="2024">2024</option>
                            <option value="2025">2025</option><option value="2026">2026</option>
                            <option value="2027">2027</option><option value="2028">2028</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Visa Status</label>
                        <select name="visa_type" id="editVisa">
                            <option value="OPT_1st_year">OPT (1st year)</option>
                            <option value="OPT_2nd_year">OPT (2nd year)</option>
                            <option value="STEM_OPT">STEM OPT</option>
                            <option value="H1B">H1B</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Job Search Status</label>
                        <select name="job_search_status" id="editJobSearchStatus">
                            <option value="actively_looking">🔥 Actively Looking</option>
                            <option value="open_to_offers">📋 Open to Offers</option>
                            <option value="not_looking">💤 Not Looking</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Preferred Job Title</label><input type="text" name="preferred_job_title" id="editPreferredJobTitle" placeholder="e.g., Java Developer, Full Stack Engineer"></div>
                <div class="form-row">
                    <div class="form-group"><label>Current Company</label><input type="text" name="current_company" id="editCurrentCompany" placeholder="Current employer (or 'Student')"></div>
                    <div class="form-group"><label>Experience Gap</label><input type="text" name="experience_gap" id="editExperienceGap" placeholder="e.g., 6 months, None"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Experience (Min Years)</label><input type="number" step="0.5" name="experience_range_min" id="editExpMin" placeholder="Min years"></div>
                    <div class="form-group"><label>Experience (Max Years)</label><input type="number" step="0.5" name="experience_range_max" id="editExpMax" placeholder="Max years"></div>
                </div>
                <div class="form-group"><label>Skills (comma separated)</label><input type="text" name="skills" id="editSkills" placeholder="Python, React, AWS"></div>
                <div class="form-row">
                    <div class="form-group"><label>LinkedIn URL</label><input type="url" name="linkedin_url" id="editLinkedin"></div>
                    <div class="form-group"><label>GitHub URL</label><input type="url" name="github_url" id="editGithub"></div>
                </div>
                <div class="form-group"><label><input type="checkbox" name="is_actively_looking" id="editLooking"> I am actively looking for opportunities</label></div>
                <button type="submit" class="save-btn">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Upload Resume Modal -->
    <div id="resumeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Upload New Resume</h3><button class="modal-close" onclick="closeResumeModal()">&times;</button></div>
            <form id="resumeUploadForm" enctype="multipart/form-data">
                <div class="form-group"><label>Choose PDF File</label><input type="file" name="resume" accept=".pdf" required></div>
                <button type="submit" class="save-btn">Upload Resume</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '';
        let studentData = null;
        let notifications = [];

        function getToken() { return localStorage.getItem('token'); }

        function checkAuth() {
            if (!getToken()) { window.location.href = '/login.html'; return false; }
            return true;
        }

        async function loadDashboard() {
            if (!checkAuth()) return;
            
            try {
                const response = await fetch(`${API_URL}/api/student/dashboard`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    studentData = result.student;
                    document.getElementById('welcomeName').innerHTML = `Welcome, ${result.student.full_name || 'Student'}!`;
                    document.getElementById('profileViews').innerText = result.stats?.profile_views || 0;
                    document.getElementById('profileStatus').innerHTML = result.student.profile_complete ? '✅ Complete' : '⚠️ Incomplete';
                    document.getElementById('unreadMessages').innerText = result.stats?.unread_messages || 0;
                    
                    const notificationCount = result.stats?.unread_notifications || 0;
                    const countElem = document.getElementById('notificationCount');
                    if (notificationCount > 0) {
                        countElem.innerText = notificationCount;
                        countElem.style.display = 'inline-block';
                    } else {
                        countElem.style.display = 'none';
                    }
                    
                    displayProfile(result);
                    
                    if (result.resumes && result.resumes.length > 0) {
                        displayResumes(result.resumes);
                    }
                    
                    loadNotifications();
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function displayProfile(data) {
            const student = data.student;
            const skills = data.skills || [];
            
            const profileHtml = `
                <div class="profile-grid">
                    <div>
                        <div class="profile-field"><div class="profile-label">Full Name</div><div class="profile-value">${escapeHtml(student.full_name) || 'Not provided'}</div></div>
                        <div class="profile-field"><div class="profile-label">Email</div><div class="profile-value">${escapeHtml(student.email) || 'Not provided'}</div></div>
                        <div class="profile-field"><div class="profile-label">Phone</div><div class="profile-value">${escapeHtml(student.phone) || 'Not provided'}</div></div>
                        <div class="profile-field"><div class="profile-label">Location</div><div class="profile-value">${escapeHtml(student.current_city) || 'N/A'}, ${escapeHtml(student.current_state) || 'N/A'}</div></div>
                        <div class="profile-field"><div class="profile-label">Preferred Job Title</div><div class="profile-value">${escapeHtml(student.preferred_job_title) || 'Not specified'}</div></div>
                        <div class="profile-field"><div class="profile-label">Current Company</div><div class="profile-value">${escapeHtml(student.current_company) || 'Not specified'}</div></div>
                        <div class="profile-field"><div class="profile-label">Job Search Status</div><div class="profile-value">${formatJobStatus(student.job_search_status)}</div></div>
                    </div>
                    <div>
                        <div class="profile-field"><div class="profile-label">University</div><div class="profile-value">${escapeHtml(student.university_name) || 'Not provided'}</div></div>
                        <div class="profile-field"><div class="profile-label">Graduation Date</div><div class="profile-value">${student.graduation_date || 'Not provided'}</div></div>
                        <div class="profile-field"><div class="profile-label">Graduation Year</div><div class="profile-value">${student.graduation_year || 'Not provided'}</div></div>
                        <div class="profile-field"><div class="profile-label">Visa Status</div><div class="profile-value">${formatVisa(student.visa_type)}</div></div>
                        <div class="profile-field"><div class="profile-label">Experience Range</div><div class="profile-value">${student.experience_range_min || '0'} - ${student.experience_range_max || '0'} years</div></div>
                        <div class="profile-field"><div class="profile-label">Experience Gap</div><div class="profile-value">${student.experience_gap || 'None'}</div></div>
                        <div class="profile-field"><div class="profile-label">Looking for jobs?</div><div class="profile-value">${student.is_actively_looking ? '✅ Yes' : '❌ No'}</div></div>
                    </div>
                </div>
                <div class="profile-field"><div class="profile-label">Skills</div><div class="skills-container">${skills.map(s => `<span class="skill-tag">${escapeHtml(s.skill_name)}</span>`).join('') || '<span>No skills added</span>'}</div></div>
                <div class="profile-field"><div class="profile-label">LinkedIn</div><div class="profile-value">${student.linkedin_url ? `<a href="${student.linkedin_url}" target="_blank" style="color:#667eea">${escapeHtml(student.linkedin_url)}</a>` : 'Not provided'}</div></div>
                <div class="profile-field"><div class="profile-label">GitHub</div><div class="profile-value">${student.github_url ? `<a href="${student.github_url}" target="_blank" style="color:#667eea">${escapeHtml(student.github_url)}</a>` : 'Not provided'}</div></div>
            `;
            
            document.getElementById('profileContent').innerHTML = profileHtml;
        }

        function displayResumes(resumes) {
            const card = document.getElementById('resumesCard');
            const container = document.getElementById('resumesList');
            
            if (resumes && resumes.length > 0) {
                card.style.display = 'block';
                let html = '';
                resumes.forEach(resume => {
                    const isActive = resume.is_active;
                    html += `
                        <div class="resume-item">
                            <div>
                                <i class="fas fa-file-pdf"></i> ${escapeHtml(resume.file_name || 'Resume')}
                                ${isActive ? '<span style="color:#48bb78; margin-left:8px;">(Current)</span>' : ''}
                                <br>
                                <small style="color:rgba(255,255,255,0.5);">Uploaded: ${new Date(resume.uploaded_at).toLocaleDateString()}</small>
                            </div>
                            <div>
                                <a href="${resume.resume_url}" target="_blank" class="resume-link" style="margin-right:10px;"><i class="fas fa-download"></i> Download</a>
                                <button class="delete-resume-btn" onclick="deleteResume('${resume.id}')"><i class="fas fa-trash"></i> Delete</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        async function deleteResume(resumeId) {
            if (!confirm('Are you sure you want to delete this resume? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/student/delete-resume/${resumeId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('✅ Resume deleted successfully');
                    loadDashboard();
                } else {
                    alert('❌ Error: ' + (result.error || 'Delete failed'));
                }
            } catch (error) {
                alert('❌ Network error: ' + error.message);
            }
        }

        async function loadNotifications() {
            try {
                const response = await fetch(`${API_URL}/api/notifications`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                if (result.success) {
                    notifications = result.notifications || [];
                }
            } catch(e) { console.error('Notifications error:', e); }
        }

        function toggleNotifications() {
            const dropdown = document.getElementById('notificationsDropdown');
            const list = document.getElementById('notificationsList');
            
            if (dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
                return;
            }
            
            if (notifications.length === 0) {
                list.innerHTML = '<div style="padding: 1rem; text-align: center; color: rgba(255,255,255,0.5);">No notifications</div>';
            } else {
                let html = '';
                notifications.forEach(n => {
                    const isUnread = !n.is_read;
                    html += `<div class="notification-item ${isUnread ? 'unread' : ''}" onclick="markNotificationRead('${n.id}')">
                        <div class="notification-title">${escapeHtml(n.title)}</div>
                        <div class="notification-message">${escapeHtml(n.message)}</div>
                        <div class="notification-time">${new Date(n.created_at).toLocaleString()}</div>
                    </div>`;
                });
                list.innerHTML = html;
            }
            
            dropdown.classList.add('show');
        }

        async function markNotificationRead(notificationId) {
            try {
                await fetch(`${API_URL}/api/notifications/mark-read`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ notification_id: notificationId })
                });
                loadDashboard();
                toggleNotifications();
            } catch(e) { console.error('Mark read error:', e); }
        }

        function formatVisa(visa) {
            const map = { 'OPT_1st_year': 'OPT (1st year)', 'OPT_2nd_year': 'OPT (2nd year)', 'STEM_OPT': 'STEM OPT', 'H1B': 'H1B' };
            return map[visa] || visa || 'Not specified';
        }

        function formatJobStatus(status) {
            const map = { 'actively_looking': '🔥 Actively Looking', 'open_to_offers': '📋 Open to Offers', 'not_looking': '💤 Not Looking' };
            return map[status] || status || 'Not specified';
        }

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        function openEditModal() {
            if (!studentData) return;
            document.getElementById('editFullName').value = studentData.full_name || '';
            document.getElementById('editPhone').value = studentData.phone || '';
            document.getElementById('editCity').value = studentData.current_city || '';
            document.getElementById('editState').value = studentData.current_state || '';
            document.getElementById('editUniversity').value = studentData.university_name || '';
            document.getElementById('editGraduation').value = studentData.graduation_date || '';
            document.getElementById('editGraduationYear').value = studentData.graduation_year || '';
            document.getElementById('editVisa').value = studentData.visa_type || '';
            document.getElementById('editJobSearchStatus').value = studentData.job_search_status || 'actively_looking';
            document.getElementById('editPreferredJobTitle').value = studentData.preferred_job_title || '';
            document.getElementById('editCurrentCompany').value = studentData.current_company || '';
            document.getElementById('editExperienceGap').value = studentData.experience_gap || '';
            document.getElementById('editExpMin').value = studentData.experience_range_min || '';
            document.getElementById('editExpMax').value = studentData.experience_range_max || '';
            document.getElementById('editSkills').value = '';
            document.getElementById('editLinkedin').value = studentData.linkedin_url || '';
            document.getElementById('editGithub').value = studentData.github_url || '';
            document.getElementById('editLooking').checked = studentData.is_actively_looking || false;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }
        function openResumeUploadModal() { document.getElementById('resumeModal').classList.add('active'); }
        function closeResumeModal() { document.getElementById('resumeModal').classList.remove('active'); }

        document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const submitBtn = e.target.querySelector('.save-btn');
            submitBtn.innerHTML = 'Saving...';
            submitBtn.disabled = true;
            try {
                const response = await fetch(`${API_URL}/api/student/update`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` },
                    body: formData
                });
                const result = await response.json();
                if (result.success) { closeEditModal(); loadDashboard(); alert('✅ Profile updated successfully!'); }
                else { alert('❌ Error: ' + (result.error || 'Update failed')); }
            } catch(error) { alert('❌ Network error: ' + error.message); }
            finally { submitBtn.innerHTML = 'Save Changes'; submitBtn.disabled = false; }
        });

        document.getElementById('resumeUploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const submitBtn = e.target.querySelector('.save-btn');
            submitBtn.innerHTML = 'Uploading...';
            submitBtn.disabled = true;
            try {
                const response = await fetch(`${API_URL}/api/student/upload-resume`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` },
                    body: formData
                });
                const result = await response.json();
                if (result.success) { closeResumeModal(); loadDashboard(); alert('✅ Resume uploaded successfully!'); }
                else { alert('❌ Error: ' + (result.error || 'Upload failed')); }
            } catch(error) { alert('❌ Network error: ' + error.message); }
            finally { submitBtn.innerHTML = 'Upload Resume'; submitBtn.disabled = false; }
        });

        function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/login.html'; }

        loadDashboard();
        
        setInterval(loadDashboard, 30000);
        
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('notificationsDropdown');
            const bell = document.querySelector('.notification-bell');
            if (bell && !bell.contains(event.target) && dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            }
        });
    </script>
</body>
</html>
